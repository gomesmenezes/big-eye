services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bigeye
      POSTGRES_USER: bigeye
      POSTGRES_PASSWORD: bigeye
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bigeye -d bigeye']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
