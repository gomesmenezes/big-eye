name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bigeye:bigeye@localhost:5432/bigeye?schema=public
      DIRECT_URL: postgresql://bigeye:bigeye@localhost:5432/bigeye?schema=public
      REDIS_URL: redis://localhost:6379
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
      SUPABASE_SERVICE_ROLE_KEY: ci-local-service-role-key
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_SECRET: ci-fake-payment-secret
      PROVIDER_MODE: fake
      WEB_ORIGIN: http://localhost:3000
      API_PORT: 3001
      QUERY_TIMEOUT_MS: 15000
      RESULT_TTL_SECONDS: 1800
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-local-anon-key
      SUPABASE_TEST_EMAIL: e2e-user@example.com
      SUPABASE_TEST_PASSWORD: e2e-password
      SUPABASE_ADMIN_EMAIL: e2e-admin@example.com
      SUPABASE_ADMIN_PASSWORD: e2e-password
      MOCK_SUPABASE_PORT: 54321
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bigeye
          POSTGRES_USER: bigeye
          POSTGRES_PASSWORD: bigeye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigeye -d bigeye"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare local Supabase auth fixture
        run: pnpm --filter @big-eye/core db:test:prepare
      - name: Apply database migrations
        run: pnpm --filter @big-eye/core db:migrate
      - name: Seed database
        run: pnpm --filter @big-eye/core db:seed
      - name: Seed deterministic E2E profiles
        run: |
          pnpm --filter @big-eye/core exec prisma db execute --stdin <<'SQL'
          INSERT INTO profiles (id, email, name, role, status)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'e2e-user@example.com', 'Usuário E2E', 'user', 'active'),
            ('22222222-2222-4222-8222-222222222222', 'e2e-admin@example.com', 'Admin E2E', 'admin', 'active')
          ON CONFLICT (id) DO UPDATE
          SET email = EXCLUDED.email, name = EXCLUDED.name, role = EXCLUDED.role, status = EXCLUDED.status;

          INSERT INTO wallets (user_id, balance)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 1000),
            ('22222222-2222-4222-8222-222222222222', 1000)
          ON CONFLICT (user_id) DO UPDATE SET balance = EXCLUDED.balance;
          SQL
      - name: Lint, typecheck, and test
        run: pnpm turbo run lint typecheck test
      - name: Build applications
        run: pnpm turbo run build
      - name: Install Playwright Chromium
        run: pnpm --filter @big-eye/web exec playwright install --with-deps chromium
      - name: Run browser journeys
        run: |
          node scripts/e2e/mock-supabase.mjs > /tmp/big-eye-mock-supabase.log 2>&1 &
          pnpm --filter @big-eye/api start > /tmp/big-eye-api.log 2>&1 &
          pnpm --filter @big-eye/worker start > /tmp/big-eye-worker.log 2>&1 &

          api_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null; then
              api_ready=true
              break
            fi
            sleep 1
          done

          if [ "$api_ready" != true ]; then
            sed -n '1,240p' /tmp/big-eye-api.log
            sed -n '1,240p' /tmp/big-eye-mock-supabase.log
            exit 1
          fi

          pnpm --filter @big-eye/web exec playwright test --workers=1
