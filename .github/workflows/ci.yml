name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bigeye:bigeye@localhost:5432/bigeye?schema=public
      DIRECT_URL: postgresql://bigeye:bigeye@localhost:5432/bigeye?schema=public
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bigeye
          POSTGRES_USER: bigeye
          POSTGRES_PASSWORD: bigeye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigeye -d bigeye"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, and test
        run: pnpm turbo run lint typecheck test
